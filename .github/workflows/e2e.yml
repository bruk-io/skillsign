name: E2E Tests

on:
  schedule:
    # Nightly at 06:00 UTC
    - cron: "0 6 * * *"
  workflow_dispatch: {}

permissions:
  id-token: write
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python
        run: uv python install 3.14

      - name: Install dependencies
        run: uv sync

      - name: Run e2e tests
        env:
          SKILLSIGN_E2E: "1"
        run: uv run pytest tests/e2e/ -v --tb=long
