[project]
name = "skillsign"
version = "0.1.0"
description = "Cryptographic signing and verification for Claude Code SKILL.md files using Sigstore keyless signing"
readme = "README.md"
license = "MIT"
requires-python = ">=3.14"
dependencies = [
    "click>=8.1",
    "sigstore>=4.2.0",
    "strictyaml>=1.7.3",
]

[project.scripts]
skillsign = "skillsign.cli:cli"

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["skillsign"]

[tool.ruff]
line-length = 88

[tool.ruff.format]
quote-style = "double"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "unit: Fast, isolated tests with no I/O",
    "integration: Tests multiple components with mocked external dependencies",
    "e2e: End-to-end tests requiring real Sigstore infrastructure",
]

[tool.mypy]
python_version = "3.14"
strict = true
warn_return_any = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["strictyaml", "strictyaml.*"]
ignore_missing_imports = true
disable_error_code = ["import-untyped"]

[[tool.mypy.overrides]]
module = ["sigstore.*", "sigstore_models.*"]
disable_error_code = ["attr-defined"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.9",
    "mypy>=1.14",
]
